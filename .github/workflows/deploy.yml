name: Deploy to GitHub Pages

# Publishes the static build on every push to main. Pages is configured for the
# Actions source, so this workflow is the deploy — no branch-based Jekyll build.
on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The custom domain in public/CNAME makes this a root deploy, so the
        # build must emit root-relative asset paths. It used to be built for
        # /specially-brilliant/ because that was the only address the site had;
        # with the CNAME in place GitHub serves it at the domain root, and a
        # subpath build puts every stylesheet and image at a URL that 404s.
        run: npm run build

      - name: Audit colour contrast
        # Checks every real text/background pair in both light and dark mode
        # against WCAG AA, so a token change cannot quietly break readability.
        run: python3 tools/audit_contrast.py

      - name: Verify the build is internally consistent
        # A broken link or a missing image should fail the deploy rather than ship.
        run: |
          python3 tools/verify_build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
